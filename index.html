<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>股票计算器--红黑观察员</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="title">股票计算器--红黑观察员</span>
    <button id="btnMenu" class="menu-btn" aria-label="菜单">☰</button>
  </header>

  <!-- 菜单抽屉 -->
  <nav id="drawer" class="drawer hidden">
    <button data-action="help">使用说明</button>
    <button data-action="register">注册</button>
    <button data-action="about">关于</button>
  </nav>

  <main class="container">
    <section class="card">
      <h2>输入参数</h2>
      <label>代码：<input id="code" type="text" inputmode="text" /></label>
      <label>名称：<input id="name" type="text" /></label>
      <label>前低：<input id="low1" type="text" inputmode="decimal" /></label>
      <label>前高：<input id="high1" type="text" inputmode="decimal" /></label>
      <label>近低：<input id="low2" type="text" inputmode="decimal" /></label>
    </section>

    <section class="card">
      <h2>计算结果</h2>
      <label>浅回调：<input id="out1" type="text" readonly /></label>
      <label>深回调：<input id="out2" type="text" readonly /></label>
      <label>观察位：<input id="out3" type="text" readonly /></label>
      <label>买入价：<input id="out4" type="text" readonly /></label>
      <label>一卖价：<input id="out5" type="text" readonly /></label>
      <label>二卖价：<input id="out6" type="text" readonly /></label>
    </section>

    <section class="card actions">
      <button id="btnCalc" class="primary">计算</button>
      <button id="btnClear">清空</button>
      <button id="btnSave">保存</button>
      <button id="btnSearch">查找</button>
    </section>

    <p class="warning">股市有风险，入市需谨慎！！！<br />所有数据不构成任何投资建议！</p>
  </main>

  <!-- 通用弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <p id="modalText"></p>
      <div class="modal-actions">
        <button id="modalOk">确定</button>
        <button id="modalCancel" class="hidden">取消</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
